<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<title>Discover</title>

<style>

/* ===== READ MORE BUTTON ===== */
.read-btn {
    display: inline-block;
    margin-top: 12px;

    padding: 10px 16px;

    font-size: 14px;
    font-weight: 500;

    color: #6C63FF;
    text-decoration: none;

    border-radius: 12px;

    background: rgba(108,99,255,0.1);

    backdrop-filter: blur(10px);

    border: 1px solid rgba(108,99,255,0.2);

    transition: all 0.3s ease;
}

/* HOVER */
.read-btn:hover {
    background: #6C63FF;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(108,99,255,0.3);
}

/* CLICK EFFECT */
.read-btn:active {
    transform: scale(0.95);
}

.news-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
    gap: 20px;
}

.news-item {
    background: #fff;
    border-radius: 15px;
    overflow: hidden;
    padding: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.news-item:hover {
    transform: translateY(-5px);
}

.news-item img {
    width: 100%;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 10px;
}

/* ===== GLOBAL ===== */
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background: linear-gradient(135deg,#EDE7FF,#F8F6FF);
    color: #333;
}

/* APP CONTAINER */
.app {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px 100px;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.header h2 {
    font-size: 32px;
    margin: 0;
}

/* ===== TOP NAV (DESKTOP) ===== */
.top-nav {
    display: flex;
    gap: 20px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    padding: 10px 18px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.top-nav a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
    font-weight: 500;
    position: relative;
    transition: 0.3s;
}

/* TEXT COLOR HOVER */
.top-nav a:hover {
    color: #6C63FF;
}

/* UNDERLINE ANIMATION */
.top-nav a::after {
    content: "";
    position: absolute;
    width: 0%;
    height: 2px;
    background: #6C63FF;
    bottom: -4px;
    left: 0;
    transition: 0.3s;
}

/* EXPAND LINE ON HOVER */
.top-nav a:hover::after {
    width: 100%;
}

/* ===== CARD ===== */
.card {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(12px);

    border-radius: 20px;
    padding: 25px;

    box-shadow: 0 10px 30px rgba(108,99,255,0.15);

    margin-bottom: 20px;
}

/* ===== NEWS ===== */
.news-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* ===== IOS GLASS NAVBAR ===== */
.navbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;

    display: flex;
    justify-content: space-around;
    align-items: center;

    padding: 16px 0;

    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(100px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);

    border: 1px solid rgba(255, 255, 255, 0.4);

    box-shadow:
        0 8px 30px rgba(0,0,0,0.15),
        inset 0 1px 1px rgba(255,255,255,0.4);
}

/* top glow */
.navbar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 10%;
    width: 80%;
    height: 1px;
    background: rgba(255,255,255,0.6);
}

.navbar a {
    font-size: 26px;
    text-decoration: none;
    color: #444;
    transition: 0.3s;
}

.navbar a:hover {
    transform: scale(1.2);
    color: #6C63FF;
}

.navbar a:active {
    transform: scale(0.9);
}

/* ===== RESPONSIVE ===== */
@media(max-width:1025px){

    .top-nav {
        display: none;
    }

    .header h2 {
        font-size: 26px;
    }
}

/* HIDE MOBILE NAVBAR ON DESKTOP */
@media (min-width:1025px){
    .navbar{ display:none; }
}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->
<div class="header">
    <h2>Discover</h2>

    <!-- DESKTOP NAV -->
    <div class="top-nav">
        <a href="{{ url_for('U_Home_page') }}">Home</a>
        <a href="{{ url_for('U_Diet_recommender') }}">Diet</a>
        <a href="{{ url_for('U_Discover') }}">Discover</a>
        <a href="{{ url_for('U_Exercises') }}">Exercises</a>
        <a href="{{ url_for('U_Select_food') }}">Scanner</a>
        <a href="{{ url_for('U_Settings') }}">Settings</a>
    </div>
</div>

<!-- NEWS CARD -->
<div class="card">
    <h3 style="text-align:center;">Latest Health News</h3>

    <div class="news-container" id="news"></div>
</div>

</div>

<!-- MOBILE NAV -->
<div class="navbar">
    <a href="{{ url_for('U_Home_page') }}">🏠</a>
    <a href="{{ url_for('U_Diet_recommender') }}">🥗</a>
    <a href="{{ url_for('U_Discover') }}">🔍</a>
    <a href="{{ url_for('U_Exercises') }}">💪</a>
    <a href="{{ url_for('U_Select_food') }}">📷</a>
    <a href="{{ url_for('U_Settings') }}">⚙️</a>
</div>

<!-- NEWS SCRIPT -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="{{ url_for('static', filename='js/newsfeed.js') }}"></script>

</body>
</html>
