{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nutrivisor Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#0f0c29;
}

/* ===== BACKGROUND BLOBS ===== */
body::before,
body::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(120px);
    z-index:0;
    animation:move 10s infinite alternate;
}

body::before{
    background:#6C63FF;
    top:-100px;
    left:-100px;
}

body::after{
    background:#A084FF;
    bottom:-100px;
    right:-100px;
}

@keyframes move{
    0%{transform:translate(0,0);}
    100%{transform:translate(50px,50px);}
}

/* ===== GRID PATTERN ===== */
.bg-pattern{
    position:absolute;
    width:100%;
    height:100%;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:30px 30px;
    z-index:1;
}

/* ===== FLOATING DOTS ===== */
.floating{
    position:absolute;
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    opacity:0.4;
    animation:float 6s infinite ease-in-out;
}

.floating:nth-child(1){top:20%; left:10%;}
.floating:nth-child(2){top:70%; left:80%; animation-delay:2s;}
.floating:nth-child(3){top:50%; left:30%; animation-delay:4s;}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

/* ===== LOGIN CARD ===== */
.wrapper{
    position:relative;
    z-index:2;
    width:100%;
    max-width:400px;
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    box-shadow:0 10px 50px rgba(0,0,0,0.5);
    color:white;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

.wrapper h2{
    text-align:center;
    margin-bottom:10px;
}

.wrapper p{
    text-align:center;
    font-size:14px;
    margin-bottom:20px;
    opacity:0.8;
}

/* INPUT */
.input_wrap{
    margin-bottom:18px;
}

.input_wrap label{
    font-size:13px;
}

.input_wrap input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,0.15);
    color:white;
}

/* BUTTON */
.btn_next{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#ffffff,#dcdcff);
    color:#6C63FF;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn_next:hover{
    transform:scale(1.05);
}

/* ERROR */
#error-msg{
    background:rgba(255,0,0,0.25);
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
}

/* ===== LOADER ===== */
#loader{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0f0c29;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;

    opacity:0;
    visibility:hidden;
    transition:0.4s;
}

#loader.active{
    opacity:1;
    visibility:visible;
}

.loader-content{
    text-align:center;
    color:white;
}

/* SPINNER */
.ring{
    width:80px;
    height:80px;
    border-radius:50%;
    border:5px solid rgba(255,255,255,0.1);
    border-top:5px solid #A084FF;
    animation:spin 1s linear infinite;
    margin:0 auto 20px;
}

@keyframes spin{
    0%{transform:rotate(0);}
    100%{transform:rotate(360deg);}
}

.loader-content p{
    opacity:0.7;
}

/* LINK */
a{
    color:white;
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="bg-pattern"></div>

<div class="floating"></div>
<div class="floating"></div>
<div class="floating"></div>

<!-- LOGIN CARD -->
<div class="wrapper">

<h2>Welcome Back 👋</h2>
<p>Login to Nutrivisor</p>

{% with messages = get_flashed_messages() %}
{% if messages %}
<div id="error-msg">
    {{ messages[0] }}
</div>
{% endif %}
{% endwith %}

<form method="post">

<div class="input_wrap">
<label>Email</label>
<input type="text" name="email" required>
</div>

<div class="input_wrap">
<label>Password</label>
<input type="password" name="pass" required>
</div>

<button type="submit" class="btn_next">Sign In →</button>

</form>

<p style="margin-top:15px;">
Don't have an account?
<a href="{{ url_for('signup') }}">Sign Up</a>
</p>

</div>

<!-- ===== LOADING SCREEN ===== -->
<div id="loader">
    <div class="loader-content">
        <div class="ring"></div>
        <h2>Nutrivisor</h2>
        <p>Analyzing your health data...</p>
    </div>
</div>

<script>
const form = document.querySelector("form");
const loader = document.getElementById("loader");

form.addEventListener("submit", function(e){
    e.preventDefault();

    loader.classList.add("active");

    setTimeout(()=>{
        form.submit();
    }, 1500);
});
</script>

</body>
</html>
{% endblock %}
