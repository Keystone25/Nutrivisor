{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Nutrivisor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#0f0c29;
}

/* ===== RIBBON BACKGROUND ===== */
.ribbon-bg{
    position:fixed;
    width:100%;
    height:100%;
    z-index:0;
}

.ribbon{
    position:absolute;
    width:200%;
    height:120px;
    opacity:0.25;
    filter:blur(50px);
    transform:rotate(-15deg);
    animation:flow 15s linear infinite;
}

.ribbon:nth-child(1){
    top:10%;
    background:linear-gradient(90deg,#6C63FF,#A084FF);
}

.ribbon:nth-child(2){
    top:45%;
    background:linear-gradient(90deg,#8EC5FC,#E0C3FC);
    animation-direction:reverse;
}

.ribbon:nth-child(3){
    top:75%;
    background:linear-gradient(90deg,#FDCB82,#F76B8A);
}

@keyframes flow{
    0%{transform:translateX(-60%) rotate(-15deg);}
    100%{transform:translateX(0%) rotate(-15deg);}
}

/* ===== LOGIN CARD ===== */
.wrapper{
    z-index:2;
    width:100%;
    max-width:380px;
    padding:25px 20px;
    border-radius:20px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    color:white;
    transition:0.4s;
}

.wrapper.hidden{
    opacity:0;
    transform:scale(0.95);
}

/* TEXT */
.wrapper h2{
    text-align:center;
    font-size:24px;
}

.wrapper p{
    text-align:center;
    font-size:13px;
    margin-bottom:20px;
    opacity:0.8;
}

/* INPUT */
.input_wrap{
    margin-bottom:14px;
}

.input_wrap label{
    font-size:12px;
}

.input_wrap input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    margin-top:6px;
    background:rgba(255,255,255,0.2);
    color:white;
}

/* BUTTON */
.btn_next{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#fff,#ddd);
    color:#6C63FF;
    font-weight:600;
    cursor:pointer;
}

/* ERROR */
#error-msg{
    background:rgba(255,0,0,0.3);
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
    text-align:center;
}

/* ===== LOADER OVERLAY ===== */
.loader-screen{
    position:fixed;
    width:100%;
    height:100%;
    background:#0f0c29;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:5;
    opacity:0;
    pointer-events:none;
    transition:0.4s;
}

.loader-screen.active{
    opacity:1;
    pointer-events:all;
}

/* SPINNER */
.circle{
    width:50px;
    height:50px;
    border:4px solid rgba(255,255,255,0.2);
    border-top:4px solid white;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    0%{transform:rotate(0);}
    100%{transform:rotate(360deg);}
}

.loader-screen p{
    color:white;
    margin-top:15px;
    font-size:14px;
}

/* ===== MOBILE ===== */
@media(max-width:480px){

    body{
        align-items:center;
        justify-content:center;
        padding:20px;
        overflow:auto;
    }

    .wrapper{
        width:100%;
        max-width:380px;
        border-radius:20px;
        padding:28px 22px;
    }

    .wrapper h2{
        font-size:22px;
    }

    .wrapper p{
        font-size:13px;
    }

    .input_wrap input{
        padding:15px;
        font-size:16px;
    }

    .btn_next{
        padding:16px;
        font-size:15px;
    }
}

</style>
</head>

<body>

<!-- RIBBONS -->
<div class="ribbon-bg">
    <div class="ribbon"></div>
    <div class="ribbon"></div>
    <div class="ribbon"></div>
</div>

<!-- LOGIN -->
<div class="wrapper" id="loginCard">

<h2>Welcome Back 👋</h2>
<p>Login to Nutrivisor</p>

{% with messages = get_flashed_messages() %}
{% if messages %}
<div id="error-msg">
    {{ messages[0] }}
</div>
{% endif %}
{% endwith %}

<form id="loginForm" action="{{ request.path }}" method="post">

<div class="input_wrap">
<label>Email</label>
<input type="text" name="email" required>
</div>

<div class="input_wrap">
<label>Password</label>
<input type="password" name="pass" required>
</div>

<button type="submit" class="btn_next">Sign In</button>

</form>

<p style="margin-top:15px;text-align:center;">
Don't have an account?
<a href="{{ url_for('signup') }}" style="color:white;">Sign Up</a>
</p>

</div>

<!-- LOADER -->
<div class="loader-screen" id="loader">
    <div class="circle"></div>
    <p>Logging you in...</p>
</div>

<script>

/* SHOW LOADER ON SUBMIT */
document.getElementById("loginForm").addEventListener("submit", function(){

    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("loader").classList.add("active");

});

/* RESET LOADER WHEN PAGE IS SHOWN AGAIN (BACK BUTTON FIX) */
window.addEventListener("pageshow", function(event) {
    if (event.persisted) {
        resetLoader();
    }
});

/* ALSO HANDLE NORMAL LOAD */
window.addEventListener("load", function() {
    resetLoader();
});

function resetLoader(){
    document.getElementById("loader").classList.remove("active");
    document.getElementById("loginCard").classList.remove("hidden");
}

</script>

</body>
</html>
{% endblock %}
