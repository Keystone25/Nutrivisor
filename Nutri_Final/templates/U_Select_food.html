<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Food Scanner</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>

/* ===== GLOBAL ===== */
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background: linear-gradient(135deg,#EDE7FF,#F8F6FF);
    text-align: center;
}

.app {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px 120px;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.header h2 {
    font-size: 30px;
    margin: 0;
}

/* ===== TOP NAV ===== */
.top-nav {
    display: flex;
    gap: 20px;
    background: rgba(255,255,255,0.6);
    padding: 10px 18px;
    border-radius: 15px;
}

.top-nav a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
    font-weight: 500;
    position: relative;
    transition: 0.3s;
}

/* TEXT COLOR HOVER */
.top-nav a:hover {
    color: #6C63FF;
}

/* UNDERLINE ANIMATION */
.top-nav a::after {
    content: "";
    position: absolute;
    width: 0%;
    height: 2px;
    background: #6C63FF;
    bottom: -4px;
    left: 0;
    transition: 0.3s;
}

/* EXPAND LINE ON HOVER */
.top-nav a:hover::after {
    width: 100%;
}

/* MOBILE HEADER */
@media(max-width:1025px){
    .header {
        flex-direction: column;
        text-align: center;
    }
    .top-nav{ display:none; }
}

/* ===== CARD ===== */
.card {
    max-width: 420px;
    margin: 30px auto;
    padding: 30px;

    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(20px);
    border-radius: 25px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

/* ===== IMAGE ===== */
.slider img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 20px;
}

/* ===== BUTTONS ===== */
.btn {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border-radius: 16px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.scan-btn {
    background: linear-gradient(135deg, #6C63FF, #4A47A3);
    color: white;
}

.report-btn {
    background: white;
    border: 2px solid #6C63FF;
    color: #6C63FF;
}

.btn:hover {
    transform: translateY(-2px);
}

/* ===== POPUP ===== */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    top: 0;
    left: 0;
    display: none;
    z-index: 99;
}

.overlay.active {
    display: block;
}

.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: white;
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: 0.3s;
    z-index: 100;
}

.popup.open {
    transform: translate(-50%, -50%) scale(1);
}

/* CLOSE BUTTON */
.close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 20px;
    cursor: pointer;
}

/* INPUTS */
.popup input, .popup textarea {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

/* ===== MOBILE NAVBAR ===== */
.navbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;

    display: flex;
    justify-content: space-around;
    padding: 14px 0;

    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(100px);

}

.navbar a {
    font-size: 26px;
    text-decoration: none;
}

/* HIDE MOBILE NAV ON DESKTOP */
@media (min-width:1025px){
    .navbar{ display:none; }
}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->
<div class="header">
    <h2>Food Scanner</h2>

    <div class="top-nav">
        <a href="{{ url_for('U_Home_page') }}">Home</a>
        <a href="{{ url_for('U_Diet_recommender') }}">Diet</a>
        <a href="{{ url_for('U_Discover') }}">Discover</a>
        <a href="{{ url_for('U_Select_food') }}">Scanner</a>
        <a href="{{ url_for('U_Settings') }}">Settings</a>
    </div>
</div>

<!-- CARD -->
<div class="card">

    <div class="slider">
        <img src="{{ url_for('static', filename='pexels-ella-olsson-1640774.jpg') }}">
    </div>

    <p style="margin-top:20px; color:#555;">
        Scan your food or request new items to improve recommendations.
    </p>

    <button class="btn scan-btn" onclick="location.href='{{ url_for('live_capture') }}'">
        <i class="fa fa-camera"></i> Scan Food
    </button>

    <button class="btn report-btn" onclick="openPopup()">
        <i class="fa fa-flag"></i> Request Food
    </button>

</div>

</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closePopup()"></div>

<!-- POPUP -->
<div class="popup" id="popup">
    <span class="close-btn" onclick="closePopup()">&times;</span>

    <h3>Request Food</h3>

    <form action="{{ request.path }}" method="post">
        <input type="text" name="name" placeholder="Food name" required>
        <textarea name="message" placeholder="Message..." required></textarea>
        <button type="submit" class="btn scan-btn">Submit</button>
    </form>
</div>

<!-- MOBILE NAV -->
<div class="navbar">
    <a href="{{ url_for('U_Home_page') }}">🏠</a>
    <a href="{{ url_for('U_Diet_recommender') }}">🥗</a>
    <a href="{{ url_for('U_Discover') }}">🔍</a>
    <a href="{{ url_for('U_Select_food') }}">📷</a>
    <a href="{{ url_for('U_Settings') }}">⚙️</a>
</div>

<script>

function openPopup(){
    document.getElementById("popup").classList.add("open");
    document.getElementById("overlay").classList.add("active");
}

function closePopup(){
    document.getElementById("popup").classList.remove("open");
    document.getElementById("overlay").classList.remove("active");
}

</script>

</body>
</html>
